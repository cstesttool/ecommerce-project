<!DOCTYPE html>
<html>
    <head>
        <title>ShopEasy - Checkout</title>
        <link rel="stylesheet" href="css/style.css"/>
    </head>
    <body>
        <header class="header">
            <h1>ShopEasy</h1>
            <nav>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <button id="logout-button">Logout</button>
            </nav>            
        </header>
        <main class="container">            
                <h2>checkout</h2>
                <div id="checkout-layout">
                    <section class="checkout-form-section">
                        <h3>Delivery Information</h3>
                        <form id="checkout-form">
                            <div>
                                <label for="checkout-name">Full Name:</label>
                                <input type="text" id="checkout-name" placeholder="Enter your full name"/>
                            </div>
                            <br>
                            <div>
                                <label for="checkout-email">Email:</label>
                                <input type="email" id="checkout-email" placeholder="Enter your email"/>
                            </div>
                            <br>
                            <div>
                                <label for="checkout-phone">Phone:</label>
                                <input type="tel" id="checkout-phone" placeholder="Enter your phone number"/>
                            </div>
                            <br>
                            <div>
                                <label for="checkout-address">Address:</label>
                                <textarea id="checkout-address" placeholder="Enter your address" rows="4"></textarea>
                            </div>
                            <br>
                            <div>
                                <label for="checkout-city">City:</label>
                                <input type="text" id="checkout-city" placeholder="Enter your city"/>
                            </div>
                            <br>
                            <div>
                                <label for="checkout-pincode">Pincode:</label>
                                <input type="text" id="checkout-pincode" placeholder="Enter your pincode"/>
                            </div>
                            <br>
                            <button type="submit" id="place-order-button">Place Order</button>
                        </form>
                        <p id="checkout-message"></p>
                    </section>
                    <!-- Order Summary Section -->
                    <section class="checkout-summary-section">
                        <h3>Order Summary</h3>
                        <div id="checkout-items"></div>
                        <div id="checkout-summary"></div>
                    </section>
                </div>                
        </main>
        <script type="module" src="js/checkout.js"></script>        
    </body>
</html>
